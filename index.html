<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="style.css">
    <script src="index.js" defer></script>
    <title>Movie Ratings</title>
</head>
<body>
    <main class="container">
        <form class="search-form">
            <div class="search-input-group">
                <input id="search-title" class="search-input" type="search" placeholder="Search movie title" autocomplete="off" />
                <button class="search-button" type="submit">Search</button>
            </div>
        </form>
        <div class="movie-poster-ratings">
            <h1 class="movie-title"></h1>
            <div class="image-placeholder">
                <img class="movie-poster" src="./images/Movie_Rating_Poster_Example.webp" alt="Movie poster">
            </div>
            <div class="section-panel ratings-section">
                <h2 class="section-title">Ratings</h2>
                <div class="ratings-info"></div>
            </div>
            <div class="section-panel info-section">
                <h2 class="section-title">Movie details</h2>
                <div class="movie-info"></div>
            </div>
            <div class="section-panel summary-section">
                <h2 class="section-title">AI summary</h2>
                <div class="ai-summary"></div>
            </div>
        </div>


    </main>
    
</body>
</html>
